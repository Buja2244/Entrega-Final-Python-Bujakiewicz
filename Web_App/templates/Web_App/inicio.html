{% extends "Web_App/base.html" %}
{% load static %}

{% block titulo_pagina %}Inicio - Tienda de Celulares{% endblock %}

{% block contenido_principal %}

    <style>
        #contenido_inicio {
            background-image: url('{% static "img/background.jpg" %}'); 
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            min-height: 100vh; 
            padding: 50px;
            color: white; 
            text-shadow: 2px 2px 4px #000000;
        }
    </style>

    <div id="contenido_inicio" class="text-center d-flex flex-column justify-content-center">
        <h1 class="display-3 fw-bold mt-5">Bienvenido al Sistema de Gestion</h1>
        <div class="mt-4">
            <a href="{% url 'celular_form' %}" class="btn btn-warning btn-lg">Registrar Productos</a>
            <a href="{% url 'admin:index' %}" class="btn btn-warning btn-lg">Panel de Admin</a>
        </div>
    </div>
{% endblock %}
