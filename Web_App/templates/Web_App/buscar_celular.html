{% extends "Web_App/base.html" %}

{% block titulo_pagina %}Buscar Celular{% endblock %}

{% block contenido_principal %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <h2 class="mb-4">Buscar Celular por Modelo</h2>
                
                <form action="{% url 'resultado_busqueda_celular' %}" method="GET" class="d-flex">
                    
                    <input type="text" name="modelo_celular" placeholder="Ingresa modelo" class="form-control me-2" required>
                    
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </form>

            </div>
        </div>
    </div>
{% endblock %}
