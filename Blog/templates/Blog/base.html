<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>{% block titulo_pagina %}TecShare{% endblock %}</title>
</head>
<body class="bg-light">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <header style="background-color: #007bff; color: white; padding: 15px;">
        <nav class="d-flex align-items-center">
            <a href="{% url 'inicio' %}" class="btn btn-light btn-sm me-2">Inicio</a>
            <a href="{% url 'Pages' %}" class="btn btn-warning btn-sm me-2">Blogs</a>
            <a href="{% url 'About' %}" class="btn btn-info btn-sm me-2">About</a>
            <form action="{% url 'Buscador' %}" method="GET" class="d-flex me-auto ms-3">
                <input class="form-control form-control-sm me-2" type="search" name="criterio" placeholder="Buscar blogs..." aria-label="Search">
                <button class="btn btn-info btn-sm me-2" type="submit">Buscar</button>
            </form>
        
            {% if user.is_authenticated %}
                <div class="d-flex align-items-center ms-auto">
                    <span class="text-white me-2">Hola, <strong>{{ user.username }}</strong></span>
                    
                    {% if user.avatar_set.last %}
                        <img src="{{ user.avatar_set.last.imagen.url }}" alt="Avatar" class="rounded-circle me-2" style="width: 35px; height: 35px; object-fit: cover; border: 1px solid white;">
                    {% endif %}

                    <a href="{% url 'EditarPerfil' %}" class="btn btn-warning btn-sm me-2">Mi Perfil</a>
                
                    <form action="{% url 'Logout' %}" method="POST" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-sm">Cerrar Sesión</button>
                    </form>
                </div>
            {% else %}
                <div class="ms-auto">
                    <a href="{% url 'Login' %}" class="btn btn-outline-light btn-sm me-2">Iniciar Sesión</a>
                    <a href="{% url 'Registro' %}" class="btn btn-light btn-sm">Registrarse</a>
                </div>
            {% endif %}
        </nav>
    </header>

    <main style="padding: 20px;">
        {% block contenido_principal %}
        {% endblock %}
    </main>

    <footer style="margin-top: 50px; padding: 10px; border-top: 1px solid #ccc;" class="text-center text-muted">
        <p>&copy; 2025 - TecShare</p>
    </footer>
</body>
</html>
